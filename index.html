    :root{
      --bg:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --line:#e5e7eb;
      --card:#ffffff;
      --accent:#2563eb;
      --accent2:#16a34a;
      --radius:16px;
      --shadow: 0 10px 30px rgba(2,6,23,.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .wrap{max-width:1080px;margin:0 auto;padding:22px}
    .nav{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:10px 0 18px;border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2px}
    .logo{
      width:34px;height:34px;border-radius:10px;
      background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(22,163,74,.75));
      box-shadow: 0 8px 18px rgba(2,6,23,.10);
    }
    .navlinks{display:flex;gap:14px;flex-wrap:wrap}
    .navlinks a{color:var(--muted);font-weight:700}
    .navlinks a:hover{color:var(--text)}

      padding:26px 0 10px;
      display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;
    }
    @media(max-width:900px){.hero{grid-template-columns:1fr}}

      font-weight:700;font-size:13px;

      letter-spacing:-.6px;
    }
